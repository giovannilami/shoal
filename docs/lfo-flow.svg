<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="title desc">
  <title id="title">One LFO, several independent parameter ranges</title>
  <desc id="desc">Example configuration: one clock-synced LFO on Track 1 drives Chance, Shift and Spread simultaneously. All three connections have arrows. Each target has its own Grid-defined range; other parameter combinations are possible. Hold Grid key 8/9 and choose two endpoints to assign a target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8fd4cb"/>
    </marker>
  </defs>
  <rect width="780" height="340" rx="18" fill="#0c1720"/>
  <text x="26" y="38" fill="#9ee1d4" font-family="monospace" font-size="18" letter-spacing="1.5">ONE LFO PER TRACK</text>
  <text x="26" y="60" fill="#a8c9c7" font-family="sans-serif" font-size="13">Example configuration: one moving phase, three independently ranged targets.</text>

  <rect x="26" y="95" width="220" height="167" rx="12" fill="#18313a" stroke="#4f9294" stroke-width="1.5"/>
  <text x="43" y="123" fill="#f4d786" font-family="monospace" font-size="16">TRACK 1  /  LFO</text>
  <text x="43" y="152" fill="#d9efec" font-family="sans-serif" font-size="14">Shape: Triangle / Steps / Sine</text>
  <text x="43" y="175" fill="#d9efec" font-family="sans-serif" font-size="14">Period: 1 / 2 / 4 / 8 bars</text>
  <path d="M45 228 L78 197 L111 228 L144 197 L177 228 L210 197" fill="none" stroke="#f4d786" stroke-width="3" stroke-linejoin="round"/>
  <text x="43" y="250" fill="#8fb8b8" font-family="sans-serif" font-size="11">Shared motion, synced to norns clock</text>

  <path d="M246 178 H280 M280 116 V240" fill="none" stroke="#8fd4cb" stroke-width="2"/>
  <path d="M280 116 H313" fill="none" stroke="#8fd4cb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M280 178 H313" fill="none" stroke="#8fd4cb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M280 240 H313" fill="none" stroke="#8fd4cb" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="monospace" font-size="15">
    <rect x="317" y="88" width="437" height="56" rx="9" fill="#20383d" stroke="#467a78"/>
    <text x="333" y="112" fill="#e8f2ed">SEQ / CHANCE</text>
    <text x="584" y="112" fill="#f4d786">50–100%</text>
    <text x="333" y="131" fill="#87b8b8" font-size="11">Grid row 3</text>

    <rect x="317" y="150" width="437" height="56" rx="9" fill="#20383d" stroke="#467a78"/>
    <text x="333" y="174" fill="#e8f2ed">SEQ / SHIFT</text>
    <text x="584" y="174" fill="#f4d786">−1…+1 step</text>
    <text x="333" y="193" fill="#87b8b8" font-size="11">Grid row 6</text>

    <rect x="317" y="212" width="437" height="56" rx="9" fill="#20383d" stroke="#467a78"/>
    <text x="333" y="236" fill="#e8f2ed">NOTE / SPREAD</text>
    <text x="584" y="236" fill="#f4d786">85–130%</text>
    <text x="333" y="255" fill="#87b8b8" font-size="11">Grid row 7</text>
  </g>

  <line x1="26" y1="284" x2="754" y2="284" stroke="#35545a"/>
  <text x="26" y="308" fill="#d9efec" font-family="monospace" font-size="13">GRID: HOLD 8/9  →  ENDPOINT A  →  ENDPOINT B  →  RELEASE</text>
  <text x="26" y="329" fill="#97b8ba" font-family="sans-serif" font-size="12">Repeat a target’s same pair to remove it. Other targets keep moving.</text>
</svg>
