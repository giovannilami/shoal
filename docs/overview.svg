<svg xmlns="http://www.w3.org/2000/svg" width="800" height="325" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Shoal for norns: screen and live controls</title>
  <desc id="desc">A compact overview. At left, a close vector reconstruction of the 128 by 64 norns display shows four tracks and their rate, length, chance and evolve values. At right, the essential encoder and key controls.</desc>
  <rect width="960" height="390" rx="16" fill="#0c1720"/>
  <text x="28" y="29" fill="#8dd4d1" font-family="monospace" font-size="15" letter-spacing="2">SHOAL / NORNS</text>
  <rect x="25" y="42" width="626" height="316" rx="8" fill="#263741" stroke="#55727b" stroke-width="1.5"/>
  <!-- The display panel remains an exact 2:1 enlargement of the 128 x 64 UI. -->
  <g transform="translate(28 45) scale(4.84375)">
  <rect width="128" height="64" fill="#101d26"/>
  <g shape-rendering="crispEdges">
    <path d="M1 2v7l6-3.5z" fill="#d6f5eb"/>
    <g fill="#d6f5eb" font-family="monospace" font-size="8" font-weight="bold">
      <text x="11" y="8" textLength="70" lengthAdjust="spacingAndGlyphs">T1 12/16 S414 TIDE</text>
      <text x="116" y="8" textLength="11" lengthAdjust="spacingAndGlyphs">1/4</text>
    </g>
    <!-- The plot follows shoal_ui.lua: x=2..65, 16 four-pixel cells, y=20/34/48/62. -->
    <g fill="none" stroke-width="3">
      <path stroke="#b2eee7" d="M3.5 20v1 M7.5 19v2 M11.5 20v1 M15.5 20v1 M19.5 18v3 M23.5 20v1 M27.5 20v1 M31.5 20v1 M35.5 15v6 M39.5 15v6 M43.5 16v5 M47.5 15v6 M51.5 16v5 M55.5 19v2 M59.5 20v1 M63.5 20v1"/>
      <path stroke="#7fb5bb" d="M3.5 33v2 M7.5 33v2 M11.5 32v3 M15.5 30v5 M19.5 32v3 M23.5 31v4 M27.5 34v1 M31.5 34v1 M35.5 31v4 M39.5 30v5 M43.5 33v2 M47.5 33v2 M51.5 33v2 M55.5 31v4 M59.5 33v2 M63.5 31v4"/>
      <path stroke="#7fb5bb" d="M3.5 48v1 M7.5 46v3 M11.5 46v3 M15.5 47v2 M19.5 47v2 M23.5 47v2 M27.5 47v2 M31.5 46v3 M35.5 46v3 M39.5 45v4 M43.5 46v3 M47.5 46v3 M51.5 47v2 M55.5 48v1 M59.5 45v4 M63.5 48v1"/>
      <path stroke="#7fb5bb" d="M3.5 60v3 M7.5 60v3 M11.5 59v4 M15.5 62v1 M19.5 60v3 M23.5 60v3 M27.5 62v1 M31.5 62v1 M35.5 62v1 M39.5 62v1 M43.5 61v2 M47.5 61v2 M51.5 60v3 M55.5 60v3 M59.5 62v1 M63.5 62v1"/>
    </g>
    <g fill="none" stroke-width="0.55">
      <rect x="46" y="13" width="4" height="8" stroke="#f6fbec"/>
      <rect x="22" y="27" width="4" height="8" stroke="#c4dfe3"/>
      <rect x="22" y="41" width="4" height="8" stroke="#c4dfe3"/>
      <rect x="22" y="55" width="4" height="8" stroke="#c4dfe3"/>
    </g>
    <!-- Values use the same source-pixel baseline as their pattern row; larger glyphs match the hardware view. -->
    <g font-family="monospace" font-size="8" font-weight="bold">
      <g fill="#e5f7f5"><text x="76" y="20" textLength="14" lengthAdjust="spacingAndGlyphs">x1.5</text><text x="93" y="20" textLength="8" lengthAdjust="spacingAndGlyphs">16</text><text x="103" y="20" textLength="14" lengthAdjust="spacingAndGlyphs">%81</text><text x="119" y="20" textLength="7" lengthAdjust="spacingAndGlyphs">E0</text></g>
      <g fill="#b6d8db"><text x="76" y="34" textLength="7" lengthAdjust="spacingAndGlyphs">x1</text><text x="93" y="34" textLength="8" lengthAdjust="spacingAndGlyphs">16</text><text x="103" y="34" textLength="14" lengthAdjust="spacingAndGlyphs">%100</text><text x="119" y="34" textLength="7" lengthAdjust="spacingAndGlyphs">E0</text></g>
      <g fill="#b6d8db"><text x="76" y="48" textLength="7" lengthAdjust="spacingAndGlyphs">x1</text><text x="93" y="48" textLength="8" lengthAdjust="spacingAndGlyphs">16</text><text x="103" y="48" textLength="14" lengthAdjust="spacingAndGlyphs">%100</text><text x="119" y="48" textLength="7" lengthAdjust="spacingAndGlyphs">E0</text></g>
      <g fill="#b6d8db"><text x="76" y="62" textLength="7" lengthAdjust="spacingAndGlyphs">x1</text><text x="93" y="62" textLength="8" lengthAdjust="spacingAndGlyphs">16</text><text x="103" y="62" textLength="14" lengthAdjust="spacingAndGlyphs">%100</text><text x="119" y="62" textLength="7" lengthAdjust="spacingAndGlyphs">E0</text></g>
    </g>
  </g>
  </g>

  <path d="M670 45V355" stroke="#344b55" stroke-width="1"/>
  <g font-family="sans-serif">
    <text x="690" y="61" fill="#8dd4d1" font-size="14" letter-spacing="2">FOUR VOICES</text>
    <text x="690" y="88" fill="#e5f7f5" font-size="24" font-weight="700">Seed → pattern</text>
    <text x="690" y="112" fill="#abc9c9" font-size="16">A playable norns adaptation</text>
    <text x="690" y="131" fill="#abc9c9" font-size="16">of Ormer Modular’s Shoal.</text>
    <path d="M690 148H932" stroke="#344b55" stroke-width="1"/>
    <text x="690" y="177" fill="#fff9c7" font-size="18" font-weight="700">E1</text>
    <text x="765" y="177" fill="#d6e9e7" font-size="17">choose track</text>
    <text x="690" y="212" fill="#fff9c7" font-size="18" font-weight="700">E2 · E3</text>
    <text x="765" y="212" fill="#d6e9e7" font-size="17">rate · length</text>
    <text x="690" y="247" fill="#fff9c7" font-size="18" font-weight="700">K2</text>
    <text x="765" y="247" fill="#d6e9e7" font-size="17">play · stop</text>
    <text x="690" y="282" fill="#fff9c7" font-size="18" font-weight="700">K3</text>
    <text x="765" y="282" fill="#d6e9e7" font-size="17">new seed</text>
    <path d="M690 302H932" stroke="#344b55" stroke-width="1"/>
    <text x="690" y="327" fill="#8dd4d1" font-size="15">n.b. · MIDI · crow</text>
    <text x="690" y="347" fill="#829fa5" font-size="14">optional 16 × 8 Grid</text>
  </g>
</svg>
